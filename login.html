<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="styling.css">
</head>
<body>
    <div class="container">
        <h2>Sign in to your account</h2>

        <form id="loginForm">
            <div class="details">
                <label for="loginUname">Username</label>
                <input id="loginUname" name="username" type="text" placeholder="Enter your username" required>
            </div>

            <div class="details">
                <label for="loginPswd">Password</label>
                <input id="loginPswd" name="password" type="password" placeholder="Password" required>
            </div>

            <button type="submit">Log in</button>
        </form>

        <p>New user? <a href="register.html">Sign up</a></p>
    </div>

    <script src="login.js"></script>
</body>

</html>
